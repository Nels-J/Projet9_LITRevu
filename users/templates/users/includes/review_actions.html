{# includes/review_actions.html #}

<div>
    {# Seul l'auteur de la critique pourra modifier/supprimer sa Review #}

        <a href="{% url 'review-delete' review.pk %}" class="btn btn-secondary">Supprimer critique</a>
    {% endif %}
</div>
